name: Deploy sync API (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check Cloudflare settings
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set, skipping deploy (see README)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "::error file=worker/wrangler.toml::Replace database_id with the id from 'npx wrangler d1 create jersey-hunt'."
            exit 1
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply D1 migrations
        if: steps.cfg.outputs.deploy == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        if: steps.cfg.outputs.deploy == 'true'
        run: npx wrangler deploy
